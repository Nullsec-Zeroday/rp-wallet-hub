<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Phantom" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/logos/icon_app.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/logos/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/logos/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/logos/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/logos/apple-touch-icon-167x167.png" sizes="167x167" />
    <link rel="apple-touch-icon" href="/logos/apple-touch-icon-152x152.png" sizes="152x152" />
    <link rel="apple-touch-icon" href="/logos/apple-touch-icon-120x120.png" sizes="120x120" />
    <meta name="msapplication-TileColor" content="#AB9FF2" />
    <meta name="msapplication-TileImage" content="/logos/icon-maskable-144x144.png" />
    <script>
      // Android-only: flag the root element so CSS can paint true black edge-to-edge
      // and switch the status bar to black. iOS is left on its original (correct) look.
      if (/android/i.test(navigator.userAgent)) {
        document.documentElement.classList.add("is-android");
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute("content", "#000000");
      }
    </script>
    <title>Ph4ntom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
